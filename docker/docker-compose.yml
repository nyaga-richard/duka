# STANDALONE Phase 1 stack (development/demo): PostgreSQL, the API, the worker
# and the Next web app. The Duka-integrated stack lives at
# deploy/compose.shop.yml and is created/upgraded by
# ../duka/deploy/go-live.sh and ../duka/deploy/update.sh.
#
# The ERP is intentionally NOT part of this stack: this repository never runs,
# modifies or fakes the ERP. Set ERP_ENABLED=true and ERP_BASE_URL only after
# the ERP operator has decided to expose the integration contract.
name: duka-ecommerce

services:
  db:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env (copy docker/env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published: only the API network can reach PostgreSQL.

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    image: duka-ecommerce-api:local
    command: ["node", "dist/migrate.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ecommerce}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    image: duka-ecommerce-api:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4100
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ecommerce}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3100}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3100}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-manual}
      PAYMENT_CAPTURE_ENABLED: "false"
      ERP_ENABLED: ${ERP_ENABLED:-false}
      ERP_BASE_URL: ${ERP_BASE_URL:-}
      ERP_ALLOWED_ORIGIN: ${ERP_ALLOWED_ORIGIN:-}
      ERP_INTEGRATION_EMAIL: ${ERP_INTEGRATION_EMAIL:-}
      ERP_INTEGRATION_PASSWORD: ${ERP_INTEGRATION_PASSWORD:-}
      ERP_DEFAULT_BRANCH_ID: ${ERP_DEFAULT_BRANCH_ID:-}
      ERP_DEFAULT_WAREHOUSE_ID: ${ERP_DEFAULT_WAREHOUSE_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-4100}:4100"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4100/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    image: duka-ecommerce-api:local
    command: ["node", "dist/worker.mjs"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ecommerce}
      ERP_ENABLED: ${ERP_ENABLED:-false}
      ERP_BASE_URL: ${ERP_BASE_URL:-}
      ERP_ALLOWED_ORIGIN: ${ERP_ALLOWED_ORIGIN:-}
      ERP_INTEGRATION_EMAIL: ${ERP_INTEGRATION_EMAIL:-}
      ERP_INTEGRATION_PASSWORD: ${ERP_INTEGRATION_PASSWORD:-}
      ERP_DEFAULT_BRANCH_ID: ${ERP_DEFAULT_BRANCH_ID:-}
      ERP_DEFAULT_WAREHOUSE_ID: ${ERP_DEFAULT_WAREHOUSE_ID:-}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-manual}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
      args:
        API_INTERNAL_URL: http://api:4100
    image: duka-ecommerce-web:local
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4100
    ports:
      - "${WEB_PORT:-3100}:3100"
    depends_on:
      api:
        condition: service_started

volumes:
  db-data:

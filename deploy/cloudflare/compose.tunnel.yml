# Combine with ../docker/compose.yml using the SAME project directory/environment.
# Requires Docker Compose >=2.24.4 for !override. No public inbound port is needed.
services:
  proxy:
    ports: !override ["127.0.0.1:8080:8080"]
    volumes: !override ["../cloudflare/Caddyfile:/etc/caddy/Caddyfile:ro"]
  tunnel:
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    command: [tunnel, --no-autoupdate, run]
    environment: {TUNNEL_TOKEN: "${TUNNEL_TOKEN:?Create and protect your Cloudflare Tunnel token}"}
    restart: unless-stopped
    depends_on: [proxy]
    networks: [edge]
    cap_drop: [ALL]
    read_only: true
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "5"}}

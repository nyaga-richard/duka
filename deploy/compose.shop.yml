# E-commerce overlay for a Duka installation.
#
# This repository is the shop; the ERP lives in its own checkout (`../duka` by
# default, or whatever `ERP_DIR` points at). The overlay is loaded on top of the
# ERP's deploy/docker/compose.yml (plus its Cloudflare Tunnel override) by this
# repo's deploy/shop.sh, by the ERP's deploy/go-live.sh and by deploy/update.sh:
#
#   SHOP_REPO_DIR=$PWD \
#   docker compose \
#     --env-file ../duka/deploy/docker/.env.production \
#     --env-file deploy/.env.shop \
#     -p duka \
#     -f ../duka/deploy/docker/compose.yml \
#     -f ../duka/deploy/cloudflare/compose.tunnel.yml \
#     -f deploy/compose.shop.yml ...
#
# `SHOP_REPO_DIR` must be the absolute path of THIS checkout: Compose resolves a
# relative build context against the project directory of the first file it was
# given (the ERP's deploy/docker), so the shop's own source has to be named
# explicitly. deploy/shop.sh exports it; running `docker compose` by hand means
# setting it yourself.
#
# The shop is a SEPARATE database, role, volume and image set inside the same
# Compose project. It never shares the Duka database, and it reaches the ERP
# (the `api` service) only as an HTTP client on the private `edge` network.
#
# Every secret is interpolated from .env.shop (mode 0600, generated by
# init-shop-env.sh, never committed) via `--env-file`, so no secret is stored in
# this file and none is passed on a command line. `docker compose config` does
# render the final secret values: never paste its output into a ticket or chat.
#
name: duka

x-shop-app-env: &shop-app-env
  NODE_ENV: production
  PORT: "4100"
  # Dedicated shop database. Never Duka's `duka` database.
  DATABASE_URL: ${SHOP_DATABASE_URL:?Run deploy/init-shop-env.sh}
  LOG_LEVEL: ${SHOP_LOG_LEVEL:-info}
  # Phase 1 boundary: no live payment provider, no automatic capture.
  PAYMENTS_MODE: ${SHOP_PAYMENTS_MODE:-manual}
  PAYMENT_CAPTURE_ENABLED: "false"
  COOKIE_SECURE: "true"
  TRUST_PROXY: "1"
  WEB_ORIGIN: https://${SHOP_PUBLIC_HOST:?Run deploy/init-shop-env.sh}
  ALLOWED_ORIGINS: https://${SHOP_PUBLIC_HOST:?Run deploy/init-shop-env.sh}
  # ERP integration is READ-ONLY (catalogue + stock). Unlike a browser, these
  # calls are server-to-server, so the adapter presents the ERP's own origin to
  # satisfy Duka's origin allowlist without widening it.
  ERP_ENABLED: ${SHOP_ERP_ENABLED:-false}
  ERP_BASE_URL: ${SHOP_ERP_BASE_URL:-http://api:4000}
  ERP_ALLOWED_ORIGIN: https://${PUBLIC_HOST:?Set PUBLIC_HOST in .env.production}
  ERP_INTEGRATION_EMAIL: ${SHOP_ERP_EMAIL:-}
  ERP_INTEGRATION_PASSWORD: ${SHOP_ERP_PASSWORD:-}
  ERP_DEFAULT_BRANCH_ID: ${SHOP_ERP_BRANCH_ID:-}
  ERP_DEFAULT_WAREHOUSE_ID: ${SHOP_ERP_WAREHOUSE_ID:-}

services:
  shop-db:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    restart: unless-stopped
    # The password comes from .env.shop through interpolation; it never appears
    # in a command line, and it is not Duka's POSTGRES_PASSWORD.
    environment:
      POSTGRES_USER: shop_app
      POSTGRES_DB: ecommerce
      POSTGRES_PASSWORD: ${SHOP_DB_PASSWORD:?Run deploy/init-shop-env.sh}
    volumes:
      - shop-database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [shop-data]
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "5"}}

  # One-shot schema migration. Runs with the schema owner from .env.shop; the
  # API/worker never migrate (forward-only, reviewed migrations only).
  shop-migrate:
    profiles: [ops]
    build: {context: ${SHOP_REPO_DIR:?Set SHOP_REPO_DIR to the duka-ecommerce checkout}, dockerfile: docker/Dockerfile, target: api}
    image: duka-shop-api:${RELEASE:-local}
    command: [node, dist/migrate.mjs]
    environment: *shop-app-env
    read_only: true
    tmpfs: [/tmp:mode=1777]
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [shop-data]
    depends_on: {shop-db: {condition: service_healthy}}
    logging: {driver: json-file, options: {max-size: 10m, max-file: "5"}}

  # One-shot settings + first administrator. Idempotent: an existing
  # administrator is reported, never overwritten.
  shop-seed:
    profiles: [ops]
    build: {context: ${SHOP_REPO_DIR:?Set SHOP_REPO_DIR to the duka-ecommerce checkout}, dockerfile: docker/Dockerfile, target: api}
    image: duka-shop-api:${RELEASE:-local}
    command: [node, dist/seed.mjs]
    environment: *shop-app-env
    read_only: true
    tmpfs: [/tmp:mode=1777]
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [shop-data]
    depends_on: {shop-db: {condition: service_healthy}}
    logging: {driver: json-file, options: {max-size: 10m, max-file: "5"}}

  shop-api:
    build: {context: ${SHOP_REPO_DIR:?Set SHOP_REPO_DIR to the duka-ecommerce checkout}, dockerfile: docker/Dockerfile, target: api}
    image: duka-shop-api:${RELEASE:-local}
    restart: unless-stopped
    init: true
    environment: *shop-app-env
    depends_on: {shop-db: {condition: service_healthy}}
    # edge: read-only HTTP access to the ERP API. shop-edge: Caddy only.
    networks: [shop-data, shop-edge, edge]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp:mode=1777]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4100/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: {driver: json-file, options: {max-size: 10m, max-file: "5"}}

  shop-worker:
    build: {context: ${SHOP_REPO_DIR:?Set SHOP_REPO_DIR to the duka-ecommerce checkout}, dockerfile: docker/Dockerfile, target: api}
    image: duka-shop-api:${RELEASE:-local}
    command: [node, dist/worker.mjs]
    restart: unless-stopped
    init: true
    environment: *shop-app-env
    depends_on:
      shop-db: {condition: service_healthy}
      shop-api: {condition: service_healthy}
    networks: [shop-data, edge]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp:mode=1777]
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "5"}}

  shop-web:
    build:
      context: ${SHOP_REPO_DIR:?Set SHOP_REPO_DIR to the duka-ecommerce checkout}
      dockerfile: docker/Dockerfile
      target: web
      args: {API_INTERNAL_URL: "http://shop-api:4100"}
    image: duka-shop-web:${RELEASE:-local}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3100"
      API_INTERNAL_URL: http://shop-api:4100
    depends_on: {shop-api: {condition: service_healthy}}
    networks: [shop-edge]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /app/apps/web/.next/cache:uid=1000,gid=1000,mode=0700
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: {driver: json-file, options: {max-size: 10m, max-file: "5"}}

  # Caddy gains a second host block (see the ERP's deploy/docker/Caddyfile and
  # deploy/cloudflare/Caddyfile) and a private network to the shop services.
  proxy:
    environment:
      SHOP_PUBLIC_HOST: "${SHOP_PUBLIC_HOST:?Run deploy/init-shop-env.sh}"
    networks: [edge, shop-edge]
    depends_on: [shop-api, shop-web]

volumes:
  shop-database:

networks:
  shop-data:
    internal: true
  shop-edge: {}
